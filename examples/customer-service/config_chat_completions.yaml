# Chat Completions Configuration (Google ADK variant, via agent_server/)
# Tests the chat_completions HTTP wrapper. Start the server first:
#   python -m agent_server.chat_completions.server
#
# Usage: arksim simulate-evaluate config_chat_completions.yaml

# ── AGENT CONFIGURATION ────────────────────────────────────────────────────

agent_config:
  agent_type: chat_completions
  agent_name: customer-service-adk-chat-completions
  api_config:
    endpoint: http://localhost:8888/chat/completions
    headers:
      Content-Type: application/json
      Authorization: "Bearer ${AGENT_API_KEY}"
    body:
      messages:
        - role: system
          content: "You are being invoked by arklex user simulator"
      enable_metadata: false

# ── SIMULATION SETTINGS ──────────────────────────────────────────────────────

scenario_file_path: ./scenarios.json
num_conversations_per_scenario: 1
max_turns: 5
output_file_path: ./results/simulation/simulation_chat_completions.json
simulated_user_prompt_template: null

# ── EVALUATION SETTINGS ──────────────────────────────────────────────────────

output_dir: ./results/evaluation_chat_completions

custom_metrics_file_paths:
  - ./custom_metrics.py

# tool_call_behavior_failure is omitted: the chat_completions response
# shape carries only the answer text, not tool_calls, so trajectory
# matching has nothing to score against over this transport.
metrics_to_run:
  - helpfulness
  - agent_behavior_failure

generate_html_report: true

# ── SHARED SETTINGS ──────────────────────────────────────────────────────────

model: gemini-flash-lite-latest
provider: google
num_workers: 50
